<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Caliper central routing spike</title>
  <link rel="icon" href="data:," />
  <style>
    body { font: 14px system-ui, sans-serif; margin: 12px; background: #111; color: #ddd; }
    select, button { font: inherit; }
    #frames { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
    figure { margin: 0; }
    figcaption { font-size: 12px; color: #999; }
    iframe { width: 360px; height: 240px; border: 1px solid #444; background: #fff; }
    #parts button { margin: 2px; }
    #status { color: #9c9; }
  </style>
</head>
<body>
  <p id="status">Starting the service worker.</p>
  <label>Project <select id="project"></select></label>
  <div id="parts"></div>
  <div id="frames"></div>
  <script type="module">
    // Spike only. ?frames=<id>~<part file>~<state>|... opens frames directly.
    // ?norecover leaves a page that the service worker does not control as it is.
    const params = new URLSearchParams(location.search)
    const status = document.getElementById("status")
    const existing = await navigator.serviceWorker.getRegistration("/")
    if (existing?.active && !navigator.serviceWorker.controller && !params.has("norecover")) {
      // A hard reload bypasses the worker for this page. A normal reload gives it back.
      sessionStorage.setItem("spike:recovered", String(Number(sessionStorage.getItem("spike:recovered") ?? 0) + 1))
      location.reload()
      await new Promise(() => {})
    }
    await navigator.serviceWorker.register("/__caliper/sw.js", { scope: "/" })
    await navigator.serviceWorker.ready
    status.textContent = `Service worker ready. This page is ${navigator.serviceWorker.controller ? "controlled" : "not controlled"}.`
    document.documentElement.dataset.spike = "ready"

    const projects = await (await fetch("/__caliper/api/projects")).json()
    const select = document.getElementById("project")
    for (const project of projects) select.append(new Option(`${project.name} (${project.id})`, project.id))
    select.onchange = () => showParts(select.value)
    if (projects[0]) showParts(projects[0].id)

    async function showParts(id) {
      const holder = document.getElementById("parts")
      holder.textContent = "Loading parts."
      const project = await (await fetch(`/__caliper/p/${id}/__caliper/project.json`)).json()
      holder.textContent = ""
      for (const part of project.parts) for (const state of part.states) {
        const button = document.createElement("button")
        button.textContent = `${part.file.split("/").pop()} · ${state.export}`
        button.onclick = () => addFrame(id, part.file, state.export)
        holder.append(button)
      }
    }

    function addFrame(id, part, state) {
      const figure = document.createElement("figure")
      const frame = document.createElement("iframe")
      frame.dataset.project = id
      frame.src = `/__caliper/p/${id}/__caliper/frame?part=${encodeURIComponent(part)}&state=${encodeURIComponent(state)}`
      const caption = document.createElement("figcaption")
      caption.textContent = `${id} ${part} ${state}`
      figure.append(frame, caption)
      document.getElementById("frames").append(figure)
    }

    for (const spec of (params.get("frames") ?? "").split("|").filter(Boolean)) addFrame(...spec.split("~"))
  </script>
</body>
</html>
