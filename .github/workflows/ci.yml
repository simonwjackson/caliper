name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: |
          npx --no-install playwright-core install --with-deps chromium
          echo "CHROMIUM=$(node -p 'require("playwright-core").chromium.executablePath()')" >> "$GITHUB_ENV"

      - name: Build the chrome
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
        env:
          CALIPER_TEST_MODULES: ${{ github.workspace }}/node_modules

  clean-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        vite: [6, 7, 8]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Pack
        run: |
          bun install --frozen-lockfile
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"

      - name: Install Chromium the way a user does
        run: npx --yes playwright-core@1.59.1 install --with-deps chromium

      - name: Install into a new Vite ${{ matrix.vite }} project and render a part
        run: scripts/verify-clean-install.sh "$RUNNER_TEMP"/pack/simonwjackson-caliper-*.tgz
        env:
          VITE_VERSION: ${{ matrix.vite }}
